[project]
name = "bro"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.3",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.69",
    "boto3-stubs~=1.43.69",
    "dataclasses-json>=0.6.7",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "mypy-boto3-s3>=1.43.66",
    "playwright>=1.62.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "seleniumbase>=4.51.10",
    "ty>=0.0.69",
    "types-aiofiles>=25.1.0.20260518",
    "types-pytz>=2026.3.1.20260727",
]

[[tool.mypy.overrides]]
module = ["seleniumbase.*"]
follow_untyped_imports = true
